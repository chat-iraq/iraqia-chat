name: daily-discovery
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discovery (no publish)
        run: python scripts/discovery.py
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report
          path: seo/discovery-report.json
