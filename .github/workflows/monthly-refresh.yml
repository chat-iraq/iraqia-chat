name: monthly-refresh
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh watchlist
        run: |
          echo "== CONTENT_REFRESH_SYSTEM watchlist =="
          python - <<'PY'
          import json
          d=json.load(open('seo/CONTENT_REFRESH_SYSTEM.json',encoding='utf-8'))
          for w in d.get('watchlist',[]):
            print(w.get('url'), '::', w.get('reason') or w.get('trigger') or '')
          PY
