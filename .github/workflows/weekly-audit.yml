name: weekly-audit
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Full QA
        run: python scripts/validate.py > audit-report.txt 2>&1 || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit
          path: audit-report.txt
